name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: creditrisk
          POSTGRES_PASSWORD: creditrisk
          POSTGRES_DB: creditrisk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creditrisk -d creditrisk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://creditrisk:creditrisk@localhost:5432/creditrisk_test
      APP_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: MyPy strict type check
        run: mypy src

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --target runtime -t credit-risk:ci .
